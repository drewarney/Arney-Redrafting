<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-label="Example drawing: mounting flange with GD&amp;T callouts">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8d97a1" stroke-width="1"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 2 10 5 0 8z" fill="#aeb7c0"/>
    </marker>
  </defs>
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#c3cad1">

    <!-- center lines -->
    <g stroke="#7d8790" stroke-width="1" stroke-dasharray="16 4 3 4" fill="none">
      <path d="M45 215H355M200 60V370"/>
      <circle cx="200" cy="215" r="105"/>
      <path d="M415 215H505M418 110H502M418 320H502"/>
    </g>

    <!-- front view -->
    <g stroke="#eef1f4" stroke-width="2" fill="none">
      <circle cx="200" cy="215" r="140"/>
      <circle cx="200" cy="215" r="62"/>
      <circle cx="200" cy="215" r="48"/>
      <circle cx="305" cy="215" r="13"/>
      <circle cx="252.5" cy="305.9" r="13"/>
      <circle cx="147.5" cy="305.9" r="13"/>
      <circle cx="95" cy="215" r="13"/>
      <circle cx="147.5" cy="124.1" r="13"/>
      <circle cx="252.5" cy="124.1" r="13"/>
    </g>

    <!-- section view -->
    <g stroke="#eef1f4" stroke-width="2">
      <rect x="430" y="75" width="60" height="22" fill="url(#hatch)"/>
      <path d="M430 123H490V167H450V153H430Z" fill="url(#hatch)"/>
      <path d="M430 307H490V263H450V277H430Z" fill="url(#hatch)"/>
      <rect x="430" y="333" width="60" height="22" fill="url(#hatch)"/>
      <path d="M430 75V355M490 75V355" fill="none"/>
    </g>
    <text x="460" y="378" text-anchor="middle" font-size="11" fill="#8d97a1">SECTION A-A</text>

    <!-- thickness dim -->
    <g stroke="#aeb7c0" stroke-width="1" fill="none">
      <path d="M430 70V40M490 70V40"/>
      <path d="M430 48H490" marker-start="url(#ar)" marker-end="url(#ar)"/>
    </g>
    <text x="460" y="34" text-anchor="middle">.750</text>

    <!-- overall diameter dim -->
    <g stroke="#aeb7c0" stroke-width="1" fill="none">
      <path d="M495 75H545M495 355H545"/>
      <path d="M537 75V355" marker-start="url(#ar)" marker-end="url(#ar)"/>
    </g>
    <text transform="translate(556 215) rotate(-90)" text-anchor="middle">Ø3.500</text>

    <!-- hole callout + feature control frame -->
    <path d="M40 72 H96 L138 114" stroke="#aeb7c0" stroke-width="1" fill="none" marker-end="url(#ar)"/>
    <text x="20" y="22">6X Ø.375 THRU</text>
    <text x="20" y="38" font-size="11" fill="#8d97a1">EQ SP ON Ø2.625 BC</text>
    <g stroke="#c3cad1" stroke-width="1" fill="none">
      <rect x="20" y="46" width="168" height="22"/>
      <path d="M44 46V68M128 46V68M158 46V68"/>
    </g>
    <g fill="none" stroke="#c3cad1" stroke-width="1.2">
      <circle cx="32" cy="57" r="6"/><path d="M24 57H40M32 49V65"/>
    </g>
    <text x="52" y="62">Ø.005</text>
    <circle cx="110" cy="57.5" r="7" fill="none" stroke="#c3cad1" stroke-width="1"/>
    <text x="110" y="61.5" text-anchor="middle" font-size="10.5">M</text>
    <text x="137" y="62">A</text>
    <text x="167" y="62">B</text>

    <!-- bore callout -->
    <path d="M40 398 H104 L162 254" stroke="#aeb7c0" stroke-width="1" fill="none" marker-end="url(#ar)"/>
    <text x="20" y="392">Ø1.250 ±.002</text>
    <g stroke="#c3cad1" stroke-width="1" fill="none">
      <rect x="20" y="404" width="20" height="20"/>
      <path d="M30 404V398"/>
    </g>
    <text x="26" y="419">B</text>

    <!-- datum A on section face -->
    <g stroke="#c3cad1" stroke-width="1">
      <path d="M430 345 L412 345 L412 395" fill="none"/>
      <path d="M430 339 L430 351 L421 345z" fill="#c3cad1"/>
      <rect x="402" y="395" width="20" height="20" fill="none"/>
    </g>
    <text x="408" y="410">A</text>

    <!-- title block -->
    <g stroke="#7d8790" stroke-width="1" fill="none">
      <rect x="446" y="392" width="148" height="44"/>
      <path d="M446 414H594M516 414V436"/>
    </g>
    <text x="453" y="407" font-size="11">FLANGE, MOUNTING</text>
    <text x="453" y="429" font-size="10" fill="#8d97a1">DWG 1001</text>
    <text x="523" y="429" font-size="10" fill="#8d97a1">REV A · 1:2</text>
  </g>
</svg>
